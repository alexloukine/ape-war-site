<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>APE WAR</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Xsolla Pay Station Widget -->
    <script src="https://cdn.xsolla.net/payments-bucket-prod/embed/1.5.3/widget.min.js"></script>

    <!-- AppLixir Rewarded Video Ads SDK -->
    <script src="https://cdn.applixir.com/applixir.sdk.js"></script>

    <!-- Chakra Petch font (military style) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Chakra Petch', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: absolute;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ===== LOADING SCREEN ===== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.8s ease-out, visibility 0.8s;
            perspective: 900px;
        }

        #loading-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Ken Burns background */
        .kb-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('/loader-bg.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1.15);
            z-index: 0;
            animation: kenburns 20s ease-out forwards;
            animation-play-state: paused;
        }

        .kb-bg.active {
            animation-play-state: running;
        }

        @keyframes kenburns {
            0% {
                opacity: 0;
                transform: scale(1.15);
            }
            5% {
                opacity: 1;
                transform: scale(1.12);
            }
            15% {
                transform: scale(1.06);
            }
            100% {
                opacity: 1;
                transform: scale(1.0);
            }
        }

        /* ===== TITLE ===== */
        .title-wrap {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 2;
            display: flex;
            align-items: baseline;
            user-select: none;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%) rotateX(10deg) rotateZ(-1deg);
            transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .title-wrap.moved-up {
            transform: translate(-50%, calc(-50% - 18vh)) rotateX(10deg) rotateZ(-1deg);
        }

        .slam-text {
            font-size: clamp(72px, 14vw, 170px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 8px;
            line-height: 1;
            opacity: 0;
            position: relative;
            transform-origin: center bottom;
            transform: scale(3.5) rotateX(-80deg) translateY(-150px);

            /* Base = shadow layer + outer stroke (::after gradient covers interior) */
            color: #1a0500;
            -webkit-text-fill-color: #1a0500;
            -webkit-text-stroke: 5px rgba(0, 0, 0, 0.9);
            paint-order: stroke fill;
            text-shadow:
                3px 6px 2px #1a0500,
                4px 14px 12px rgba(0, 0, 0, 0.55),
                6px 24px 30px rgba(0, 0, 0, 0.3);
        }

        /* Gradient text layer — renders on top, covers base interior leaving outer stroke visible */
        .slam-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;

            /* Gradient text: white > orange > deep red */
            background: linear-gradient(
                175deg,
                #ffffff 0%,
                #fff3e0 15%,
                #ffb74d 35%,
                #ff7043 55%,
                #e53935 75%,
                #b71c1c 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

            /* Orange/red glow — single filter + text-shadow fallback (perf: 3 filter passes → 1) */
            filter: drop-shadow(0 0 20px rgba(255, 100, 20, 0.8));
            text-shadow: 0 0 40px rgba(255, 60, 0, 0.5), 0 0 80px rgba(200, 20, 0, 0.3);
        }

        .slam-text.slam-in {
            animation: slamIn 0.55s cubic-bezier(0.12, 0.8, 0.3, 1) forwards;
        }

        /* Oscillates around rotateX(0) — parent .title-wrap provides the constant 10deg tilt */
        @keyframes slamIn {
            0% {
                opacity: 0;
                transform: scale(3.5) rotateX(-80deg) translateY(-150px);
            }
            35% {
                opacity: 1;
                transform: scale(1.6) rotateX(-20deg) translateY(-40px);
            }
            50% {
                transform: scale(1.05) rotateX(8deg) translateY(5px);
            }
            68% {
                transform: scale(0.98) rotateX(-2deg) translateY(-2px);
            }
            84% {
                transform: scale(1.01) rotateX(1deg) translateY(0);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateX(0deg) translateY(0);
            }
        }

        .title-io {
            font-size: clamp(26px, 5.5vw, 64px);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 2px;
            opacity: 0;
            transform: translateX(-8px) scale(0.9);
            transition: opacity 0.8s ease, transform 0.8s ease;
            align-self: flex-end;
            margin-bottom: clamp(6px, 1.2vw, 16px);
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.4);
            text-shadow: 0 0 12px rgba(255, 150, 50, 0.25);
        }

        .title-io.visible {
            opacity: 1;
            transform: translateX(0) scale(1);
        }

        /* ===== PARTICLES CONTAINER ===== */
        .dust-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            overflow: hidden;
        }

        /* Sparks - elongated hot streaks */
        .spark {
            position: absolute;
            border-radius: 2px;
            opacity: 0;
        }

        .spark.burst {
            animation: sparkBurst var(--dur, 0.7s) ease-out forwards;
        }

        @keyframes sparkBurst {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(var(--angle, 0deg)) scale(1);
            }
            25% { opacity: 1; }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) rotate(var(--angle, 0deg)) scale(0.15);
            }
        }

        /* Debris chunks - tumbling rectangles */
        .debris {
            position: absolute;
            background: rgba(160, 90, 30, 0.85);
            opacity: 0;
        }

        .debris.burst {
            animation: debrisBurst var(--dur, 0.8s) ease-out forwards;
        }

        @keyframes debrisBurst {
            0% {
                opacity: 0.9;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), calc(var(--dy) + 70px)) rotate(var(--rot, 180deg)) scale(0.4);
            }
        }

        /* Shockwave — 16-sided polygon, tilted to ground plane */
        .shockwave {
            position: absolute;
            width: 30px;
            height: 30px;
            margin-left: -15px;
            margin-top: -15px;
            background: radial-gradient(circle, transparent 38%, rgba(255, 160, 60, 0.7) 50%, rgba(255, 160, 60, 0.3) 65%, transparent 75%);
            clip-path: polygon(50% 0%, 69.1% 3.8%, 85.4% 14.6%, 96.2% 30.9%, 100% 50%, 96.2% 69.1%, 85.4% 85.4%, 69.1% 96.2%, 50% 100%, 30.9% 96.2%, 14.6% 85.4%, 3.8% 69.1%, 0% 50%, 3.8% 30.9%, 14.6% 14.6%, 30.9% 3.8%);
            animation: shockwaveExpand 0.55s ease-out forwards;
        }

        @keyframes shockwaveExpand {
            0% {
                transform: rotateX(-70deg) scale(0);
                opacity: 1;
            }
            100% {
                transform: rotateX(-70deg) scale(14);
                opacity: 0;
            }
        }

        /* Impact flash — polygonal, tilted to ground plane */
        .impact-flash {
            position: absolute;
            width: 60px;
            height: 60px;
            margin-left: -30px;
            margin-top: -30px;
            background: radial-gradient(circle, rgba(255,220,140,0.95) 0%, rgba(255,120,20,0.6) 35%, transparent 70%);
            clip-path: polygon(50% 0%, 69.1% 3.8%, 85.4% 14.6%, 96.2% 30.9%, 100% 50%, 96.2% 69.1%, 85.4% 85.4%, 69.1% 96.2%, 50% 100%, 30.9% 96.2%, 14.6% 85.4%, 3.8% 69.1%, 0% 50%, 3.8% 30.9%, 14.6% 14.6%, 30.9% 3.8%);
            animation: flashPulse 0.3s ease-out forwards;
        }

        @keyframes flashPulse {
            0% {
                transform: rotateX(-70deg) scale(0.3);
                opacity: 1;
            }
            40% {
                transform: rotateX(-70deg) scale(3.5);
                opacity: 0.9;
            }
            100% {
                transform: rotateX(-70deg) scale(6);
                opacity: 0;
            }
        }

        /* Rock chunks — angular polygonal pieces */
        .rock {
            position: absolute;
            opacity: 0;
        }

        .rock.burst {
            animation: rockBurst var(--dur, 0.9s) ease-out forwards;
        }

        @keyframes rockBurst {
            0% {
                opacity: 0.9;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), calc(var(--dy) + 100px)) rotate(var(--rot, 120deg)) scale(0.5);
            }
        }

        /* Ground line flash on impact */
        .ground-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 160, 60, 0.8), rgba(255, 200, 100, 1), rgba(255, 160, 60, 0.8), transparent);
            animation: groundFlash 0.4s ease-out forwards;
            transform: translateX(-50%);
        }

        @keyframes groundFlash {
            0% {
                width: 0;
                opacity: 1;
            }
            40% {
                width: 400px;
                opacity: 0.9;
            }
            100% {
                width: 600px;
                opacity: 0;
            }
        }

        /* ===== SCREEN SHAKE ===== */
        #loading-screen.shake {
            animation: screenShake 0.4s ease-out;
        }

        @keyframes screenShake {
            0%  { transform: translate(0, 0) rotate(0); }
            10% { transform: translate(-10px, 5px) rotate(-0.6deg); }
            20% { transform: translate(8px, -8px) rotate(0.5deg); }
            30% { transform: translate(-7px, 4px) rotate(-0.4deg); }
            40% { transform: translate(5px, -3px) rotate(0.3deg); }
            55% { transform: translate(-3px, 2px) rotate(-0.15deg); }
            70% { transform: translate(2px, -1px) rotate(0.08deg); }
            85% { transform: translate(-1px, 1px) rotate(0); }
            100% { transform: translate(0, 0) rotate(0); }
        }

        /* ===== LOADING BAR AREA ===== */
        .loader-area {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 2;
            width: 500px;
            max-width: 85%;
            opacity: 0;
            transform: translate(-50%, 60px);
        }

        .loader-area.slide-up {
            animation: slideUp 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translate(-50%, 60px);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, 20px);
            }
        }

        .loading-bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .loading-throbber {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        .loading-bar-bg {
            width: 100%;
            height: 36px;
            position: relative;
            flex: 1;
            overflow: hidden;
            /* Tribal chamfered corners — 45-degree cuts */
            clip-path: polygon(
                10px 0, calc(100% - 10px) 0,
                100% 10px, 100% calc(100% - 10px),
                calc(100% - 10px) 100%, 10px 100%,
                0 calc(100% - 10px), 0 10px
            );
            /* 3D inset groove — hard top shadow, lit bottom lip */
            background:
                linear-gradient(180deg,
                    rgba(0,0,0,0.6) 0px, rgba(0,0,0,0.6) 2px,
                    rgba(255,255,255,0.04) 2px, rgba(255,255,255,0.04) calc(100% - 2px),
                    rgba(255,255,255,0.12) calc(100% - 2px), rgba(255,255,255,0.12) 100%
                );
            box-shadow: 0 0 1px rgba(255,180,80,0.25), 0 2px 4px rgba(0,0,0,0.5);
        }

        .loading-bar-fill {
            width: 0%;
            height: 100%; /* 3D hard-lit bar — sharp bevel faces */
            background:
                linear-gradient(180deg,
                    #6aefaa 0px, #6aefaa 3px,
                    #3ddc84 3px, #22c55e 8px,
                    #1cb850 50%,
                    #16a34a calc(100% - 6px),
                    #0d7c34 calc(100% - 4px),
                    #085c26 calc(100% - 2px),
                    #064d1f 100%
                );
            transition: width 0.3s ease-out;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .loading-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 100%;
            /* Hard-edged shimmer to match angular style */
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.25) 35%, rgba(255,255,255,0.25) 65%, transparent 100%);
            animation: shimmer-pass 2s infinite;
            will-change: transform;
        }

        @keyframes shimmer-pass {
            0% { transform: translateX(-120px); }
            100% { transform: translateX(600px); }
        }

        .loading-bar-fill.indeterminate {
            width: 30% !important;
            animation: indeterminate-slide 1.5s infinite ease-in-out;
        }

        @keyframes indeterminate-slide {
            0% { margin-left: 0%; }
            50% { margin-left: 70%; }
            100% { margin-left: 0%; }
        }

        .loading-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .loading-percent {
            font-size: 28px;
            color: #fff;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
        }

        .loading-size {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            font-variant-numeric: tabular-nums;
        }

        .loading-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 18px;
            text-align: center;
            min-height: 20px;
            font-variant-numeric: tabular-nums;
        }

        .init-spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        .init-spinner.visible {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translateX(-50%);
            background: rgba(180, 40, 40, 0.95);
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            display: none;
            z-index: 200;
        }

        @media (prefers-reduced-motion: reduce) {
            .slam-text { animation: none !important; opacity: 1 !important; transform: none !important; }
            .slam-text::after { filter: none !important; }
            .kb-bg { animation: none !important; opacity: 1 !important; transform: none !important; }
            #loading-screen.shake { animation: none !important; }
            .loading-bar-fill::after { animation: none !important; }
        }

        @media (max-width: 480px) {
            .loading-percent {
                font-size: 22px;
            }
            .loading-bar-bg {
                height: 28px;
                clip-path: polygon(
                    8px 0, calc(100% - 8px) 0,
                    100% 8px, 100% calc(100% - 8px),
                    calc(100% - 8px) 100%, 8px 100%,
                    0 calc(100% - 8px), 0 8px
                );
            }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="kb-bg" id="kb-bg"></div>
        <div class="dust-container" id="dust-container"></div>

        <div class="title-wrap" id="title-wrap">
            <span class="slam-text" id="slam-ape" data-text="APE">APE</span>
            <span class="slam-text" id="slam-war" data-text="WAR">WAR</span>
            <span class="title-io" id="title-io">.io</span>
        </div>

        <div class="loader-area" id="loader-area">
            <div class="loading-bar-row">
                <div class="loading-throbber"></div>
                <div class="loading-bar-bg">
                    <div class="loading-bar-fill" id="loading-bar"></div>
                </div>
            </div>

            <div class="loading-stats">
                <div class="loading-percent" id="loading-percent">0%</div>
                <div class="loading-size" id="loading-size"></div>
            </div>

            <div class="init-spinner" id="init-spinner"></div>
            <div class="loading-text" id="loading-text"></div>
        </div>
    </div>

    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="0"></canvas>
    </div>

    <div id="unity-warning"></div>

    <!-- Intro slam sequence -->
    <script>
        (function() {
            var slamApe = document.getElementById('slam-ape');
            var slamWar = document.getElementById('slam-war');
            var titleIo = document.getElementById('title-io');
            var kbBg = document.getElementById('kb-bg');
            var loaderArea = document.getElementById('loader-area');
            var dustContainer = document.getElementById('dust-container');
            var screen = document.getElementById('loading-screen');

            function shake() {
                screen.classList.remove('shake');
                void screen.offsetWidth;
                screen.classList.add('shake');
            }

            var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function spawnImpact(originX, originY) {
                if (prefersReducedMotion) return;

                // Impact flash
                var flash = document.createElement('div');
                flash.className = 'impact-flash';
                flash.style.left = originX + 'px';
                flash.style.top = originY + 'px';
                dustContainer.appendChild(flash);
                setTimeout(function() { flash.remove(); }, 400);

                // Shockwave ring
                var ring = document.createElement('div');
                ring.className = 'shockwave';
                ring.style.left = originX + 'px';
                ring.style.top = originY + 'px';
                dustContainer.appendChild(ring);
                setTimeout(function() { ring.remove(); }, 600);

                // Ground line flash
                var line = document.createElement('div');
                line.className = 'ground-line';
                line.style.left = originX + 'px';
                line.style.top = originY + 'px';
                dustContainer.appendChild(line);
                setTimeout(function() { line.remove(); }, 500);

                // Sparks - hot elongated streaks (reduced for perf)
                for (var i = 0; i < 12; i++) {
                    var spark = document.createElement('div');
                    spark.className = 'spark';
                    var angle = Math.PI * 0.15 + Math.random() * Math.PI * 0.7;
                    var dist = 70 + Math.random() * 220;
                    var dx = Math.cos(angle) * dist * (Math.random() > 0.5 ? 1 : -1);
                    var dy = Math.sin(angle) * dist;
                    spark.style.left = originX + (Math.random() * 40 - 20) + 'px';
                    spark.style.top = originY + (Math.random() * 10 - 5) + 'px';
                    spark.style.setProperty('--dx', dx + 'px');
                    spark.style.setProperty('--dy', dy + 'px');
                    spark.style.setProperty('--angle', Math.round(Math.atan2(dy, dx) * 180 / Math.PI) + 'deg');
                    var thickness = 1.5 + Math.random() * 3;
                    var length = thickness * (3 + Math.random() * 5);
                    spark.style.width = length + 'px';
                    spark.style.height = thickness + 'px';
                    var hue = Math.random() > 0.25 ? (15 + Math.random() * 30) : (45 + Math.random() * 15);
                    var light = 50 + Math.random() * 40;
                    spark.style.background = 'hsl(' + hue + ', 100%, ' + light + '%)';
                    spark.style.setProperty('--dur', (0.35 + Math.random() * 0.55) + 's');
                    spark.style.borderRadius = '1px';
                    dustContainer.appendChild(spark);
                    spark.classList.add('burst');
                    setTimeout(function(e) { e.remove(); }.bind(null, spark), 1100);
                }

                // Debris - tumbling chunks (reduced for perf)
                for (var j = 0; j < 5; j++) {
                    var debris = document.createElement('div');
                    debris.className = 'debris';
                    var dAngle = Math.PI * 0.1 + Math.random() * Math.PI * 0.8;
                    var dDist = 25 + Math.random() * 90;
                    var ddx = Math.cos(dAngle) * dDist;
                    var ddy = Math.sin(dAngle) * dDist * 0.5 + 15;
                    debris.style.left = originX + (Math.random() * 30 - 15) + 'px';
                    debris.style.top = originY + 'px';
                    debris.style.setProperty('--dx', ddx + 'px');
                    debris.style.setProperty('--dy', ddy + 'px');
                    debris.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
                    debris.style.width = (4 + Math.random() * 8) + 'px';
                    debris.style.height = (3 + Math.random() * 5) + 'px';
                    debris.style.setProperty('--dur', (0.45 + Math.random() * 0.45) + 's');
                    debris.style.borderRadius = '1px';
                    dustContainer.appendChild(debris);
                    debris.classList.add('burst');
                    setTimeout(function(e) { e.remove(); }.bind(null, debris), 1200);
                }

                // Rocks - angular polygonal chunks
                var rockShapes = [
                    'polygon(15% 0%, 85% 8%, 100% 45%, 80% 95%, 25% 100%, 0% 55%)',
                    'polygon(25% 0%, 90% 5%, 95% 50%, 75% 100%, 10% 90%, 0% 35%)',
                    'polygon(10% 5%, 70% 0%, 100% 35%, 90% 85%, 40% 100%, 0% 65%)',
                    'polygon(20% 0%, 80% 10%, 100% 60%, 70% 100%, 5% 85%, 0% 30%)'
                ];
                for (var r = 0; r < 3; r++) {
                    var rock = document.createElement('div');
                    rock.className = 'rock';
                    var rAngle = Math.PI * 0.1 + Math.random() * Math.PI * 0.8;
                    var rDist = 30 + Math.random() * 120;
                    var rdx = Math.cos(rAngle) * rDist;
                    var rdy = Math.sin(rAngle) * rDist * 0.4 + 20;
                    rock.style.left = originX + (Math.random() * 20 - 10) + 'px';
                    rock.style.top = originY + 'px';
                    rock.style.setProperty('--dx', rdx + 'px');
                    rock.style.setProperty('--dy', rdy + 'px');
                    rock.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
                    var rSize = 8 + Math.random() * 14;
                    rock.style.width = rSize + 'px';
                    rock.style.height = rSize * (0.6 + Math.random() * 0.5) + 'px';
                    rock.style.background = 'hsl(' + (15 + Math.random() * 20) + ', ' + (30 + Math.random() * 30) + '%, ' + (25 + Math.random() * 20) + '%)';
                    rock.style.clipPath = rockShapes[Math.floor(Math.random() * rockShapes.length)];
                    rock.style.setProperty('--dur', (0.5 + Math.random() * 0.5) + 's');
                    dustContainer.appendChild(rock);
                    rock.classList.add('burst');
                    setTimeout(function(e) { e.remove(); }.bind(null, rock), 1300);
                }
            }

            // 0.5s - APE slams
            setTimeout(function() {
                slamApe.classList.add('slam-in');
                shake();
                var rect = slamApe.getBoundingClientRect();
                spawnImpact(rect.left + rect.width * 0.5, rect.bottom + 8);
            }, 500);

            // 1.15s - WAR slams
            setTimeout(function() {
                slamWar.classList.add('slam-in');
                shake();
                var rect = slamWar.getBoundingClientRect();
                spawnImpact(rect.left + rect.width * 0.5, rect.bottom + 8);
            }, 1150);

            // 1.8s - BG Ken Burns starts + .io fades in
            setTimeout(function() {
                kbBg.classList.add('active');
            }, 1800);

            // 1.8s - .io fades in
            setTimeout(function() {
                titleIo.classList.add('visible');
            }, 1800);

            // 2.5s - title moves up, loader slides in, start idle bob
            setTimeout(function() {
                var titleWrap = document.getElementById('title-wrap');
                titleWrap.classList.add('moved-up');
                loaderArea.classList.add('slide-up');

                // Random idle animation — picks new values each cycle
                var scales = [0.88, 0.91, 0.94, 1.0, 1.06, 1.09, 1.12, 1.15, 0.85, 0.97];
                var rotZs = [-3.0, -1.6, 0, 1.2, 2.4, -0.6, 1.8, -2.2, 0.8, -1.2];
                var rotXs = [7, 8, 9, 10, 11, 12, 13, 7.5, 11.5, 8.5];
                var durations = [2.0, 2.4, 2.8, 3.2, 1.8, 2.6, 3.0, 2.2];
                var lastScale = -1, lastRotZ = -1;

                function idleTick() {
                    var si = Math.floor(Math.random() * scales.length);
                    var ri = Math.floor(Math.random() * rotZs.length);
                    var xi = Math.floor(Math.random() * rotXs.length);
                    // Avoid repeating the same value twice in a row
                    while (si === lastScale) si = Math.floor(Math.random() * scales.length);
                    while (ri === lastRotZ) ri = Math.floor(Math.random() * rotZs.length);
                    lastScale = si;
                    lastRotZ = ri;

                    var dur = durations[Math.floor(Math.random() * durations.length)];
                    titleWrap.style.transition = 'transform ' + dur + 's ease-in-out';
                    titleWrap.style.transform = 'translate(-50%, calc(-50% - 18vh)) rotateX(' + rotXs[xi] + 'deg) rotateZ(' + rotZs[ri] + 'deg) scale(' + scales[si] + ')';
                    setTimeout(idleTick, dur * 1000);
                }

                // Start after the move-up transition finishes (0.9s)
                setTimeout(idleTick, 1000);
            }, 2500);
        })();
    </script>

    <script>
        // Global Unity instance reference
        var unityInstance = null;
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingScreen = document.querySelector("#loading-screen");
        var loadingBar = document.querySelector("#loading-bar");
        var loadingPercent = document.querySelector("#loading-percent");
        var loadingText = document.querySelector("#loading-text");
        var loadingSize = document.querySelector("#loading-size");
        var initSpinner = document.querySelector("#init-spinner");
        var warningBanner = document.querySelector("#unity-warning");

        // Skip loading screen immediately (used when game is fully loaded before intro finishes)
        function skipLoadingScreen() {
            loadingScreen.style.pointerEvents = 'none';
            loadingScreen.classList.add('fade-out');
            setTimeout(function() {
                canvas.focus();
                resizeCanvas();
            }, 100);
        }

        // Fix canvas sizing for fullscreen
        function resizeCanvas() {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // Xsolla Pay Station Bridge
        window.xsollaPayStation = { lastStatus: '', lastError: '' };
        window.xsollaOpenPayStation = function(accessToken, isSandbox) {
            window.xsollaPayStation.lastStatus = '';
            window.xsollaPayStation.lastError = '';
            if (document.exitPointerLock) document.exitPointerLock();
            try {
                XPayStationWidget.init({
                    access_token: accessToken,
                    sandbox: !!isSandbox,
                    lightbox: { zIndex: 10000, overlayOpacity: 0.85 }
                });
                XPayStationWidget.on(XPayStationWidget.eventTypes.STATUS_DONE, function() {
                    window.xsollaPayStation.lastStatus = 'done';
                });
                XPayStationWidget.on(XPayStationWidget.eventTypes.CLOSE, function() {
                    if (!window.xsollaPayStation.lastStatus) window.xsollaPayStation.lastStatus = 'close';
                });
                XPayStationWidget.open();
            } catch (e) {
                console.error('[XsollaPayStation] Failed to open:', e);
                window.xsollaPayStation.lastStatus = 'error';
                window.xsollaPayStation.lastError = e.message || 'Unknown error';
            }
        };

        // WASD Input Bridge for Chrome WebGL fix
        // Chrome has issues with Unity's WebGL input handling for certain keys
        // This tracks key states directly in JavaScript and exposes them to Unity
        window.wasdKeyStates = { w: false, a: false, s: false, d: false };
        window.keyStates = {};

        // Unity Input Field Focus Bridge
        // When true, Unity has an input field focused - allow all keys through
        window.unityInputFieldFocused = false;

        // NOTE: The Chrome macOS WASD fix is handled by the keyStates tracking below
        // + WASDInputBridge.jslib + bl_WebGLInputBridge.cs. Game input during typing is
        // blocked by bl_WebGLInputBridge returning false/0 + the isTyping check in keydown.
        // No addEventListener wrapper needed — it was blocking Emscripten's text input pipeline.

        // Prototype-level overrides: prevent Emscripten from blocking keyboard input to Unity's hidden <input>
        (function() {
            var origPreventDefault = Event.prototype.preventDefault;
            var origStopPropagation = Event.prototype.stopPropagation;
            var origStopImmediate = Event.prototype.stopImmediatePropagation;

            Event.prototype.preventDefault = function() {
                if (window.unityInputFieldFocused && this instanceof KeyboardEvent) return;
                return origPreventDefault.call(this);
            };
            Event.prototype.stopPropagation = function() {
                if (window.unityInputFieldFocused && this instanceof KeyboardEvent) return;
                return origStopPropagation.call(this);
            };
            Event.prototype.stopImmediatePropagation = function() {
                if (window.unityInputFieldFocused && this instanceof KeyboardEvent) return;
                return origStopImmediate.call(this);
            };
        })();

        window.setUnityInputFieldFocus = function(focused) {
            window.unityInputFieldFocused = focused;
            // Clear all key states when focusing to prevent stuck movement
            if (focused) {
                window.wasdKeyStates.w = false;
                window.wasdKeyStates.a = false;
                window.wasdKeyStates.s = false;
                window.wasdKeyStates.d = false;
                for (var k in window.keyStates) window.keyStates[k] = false;
            }
        };

        document.addEventListener('keydown', function(e) {
            var key = e.key.toLowerCase();

            // Check if user is typing in a text input - if so, don't block keys
            var activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            var isTyping = (activeTag === 'input' || activeTag === 'textarea') ||
                           (document.activeElement && document.activeElement.isContentEditable) ||
                           window.unityInputFieldFocused ||
                           // Fallback: detect Unity's hidden text input element in the DOM
                           document.querySelector('#unity-container input, #unity-container textarea') !== null;

            // Track all keys via code (only when not typing)
            if (!isTyping) {
                if (e.code) window.keyStates[e.code] = true;
                if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                    window.wasdKeyStates[key] = true;
                }
            }

            // Prevent browser defaults that interfere with gameplay (scroll, focus change)
            // Letter keys have no browser default on a canvas so they don't need preventDefault
            if (!isTyping && (e.code === 'Space' || e.code === 'Tab' || e.code === 'Escape')) {
                e.preventDefault();
            }
        }, true);

        document.addEventListener('keyup', function(e) {
            var key = e.key.toLowerCase();
            if (e.code) window.keyStates[e.code] = false;
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                window.wasdKeyStates[key] = false;
            }
        }, true);

        // Reset key states when window loses focus (prevents stuck keys)
        window.addEventListener('blur', function() {
            window.wasdKeyStates.w = false;
            window.wasdKeyStates.a = false;
            window.wasdKeyStates.s = false;
            window.wasdKeyStates.d = false;
            for (var k in window.keyStates) window.keyStates[k] = false;
            // Mark blur so pointerlockchange knows this isn't ESC
            window.escPassthroughState.recentBlur = true;
            setTimeout(function() { window.escPassthroughState.recentBlur = false; }, 300);
        });

        // Expose WASD states to Unity via jslib (legacy fallback)
        window.getWASDState = function() {
            return JSON.stringify(window.wasdKeyStates);
        };

        // Mouse Movement Bridge for Pointer Lock API
        // Tracks raw mouse movement deltas that work even at screen edges
        window.mouseMovementState = { deltaX: 0, deltaY: 0 };

        // ESC Passthrough Bridge for Pointer Lock
        window.escPassthroughState = { pendingEsc: false, programmaticUnlock: false, recentBlur: false };

        var _origExitPointerLock = document.exitPointerLock.bind(document);
        document.exitPointerLock = function() {
            window.escPassthroughState.programmaticUnlock = true;
            return _origExitPointerLock();
        };

        document.addEventListener('mousemove', function(e) {
            window.mouseMovementState.deltaX += e.movementX || 0;
            window.mouseMovementState.deltaY += e.movementY || 0;
        });

        window.addEventListener('blur', function() {
            window.mouseMovementState.deltaX = 0;
            window.mouseMovementState.deltaY = 0;
            window.escPassthroughState.recentBlur = true;
            setTimeout(function() { window.escPassthroughState.recentBlur = false; }, 300);
        });

        document.addEventListener('pointerlockchange', function() {
            window.mouseMovementState.deltaX = 0;
            window.mouseMovementState.deltaY = 0;

            if (document.pointerLockElement) {
                window.escPassthroughState.programmaticUnlock = false;
            } else {
                if (window.escPassthroughState.programmaticUnlock) {
                    window.escPassthroughState.programmaticUnlock = false;
                } else if (!window.escPassthroughState.recentBlur) {
                    window.escPassthroughState.pendingEsc = true;
                }
            }
        });

        function focusCanvas() {
            if (window.unityInputFieldFocused) return;
            var active = document.activeElement;
            if (active && active !== canvas &&
                (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
                return;
            }
            canvas.focus();
        }

        // Resume AudioContext on first user gesture (browsers require user interaction)
        function resumeAudioContext() {
            if (window.unityInstance && window.unityInstance.Module) {
                var ctx = window.unityInstance.Module.audioContext ||
                          (typeof AudioContext !== 'undefined' && AudioContext.prototype._unityContext);
                if (ctx && ctx.state === 'suspended') ctx.resume();
            }
            // Also handle any AudioContext created before Unity
            if (typeof AudioContext !== 'undefined') {
                var allContexts = window._audioContexts || [];
                for (var i = 0; i < allContexts.length; i++) {
                    if (allContexts[i].state === 'suspended') allContexts[i].resume();
                }
            }
        }

        document.body.addEventListener("click", function() { focusCanvas(); resumeAudioContext(); });
        document.body.addEventListener("mousedown", focusCanvas);
        document.body.addEventListener("pointerdown", resumeAudioContext);
        document.body.addEventListener("touchstart", resumeAudioContext, { once: true });
        window.addEventListener("focus", focusCanvas);

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                window.escPassthroughState.recentBlur = true;
                setTimeout(function() { window.escPassthroughState.recentBlur = false; }, 300);
            } else {
                setTimeout(focusCanvas, 100);
            }
        });

        function unityShowBanner(msg, type) {
            warningBanner.style.display = "block";
            warningBanner.innerText = msg;
            setTimeout(function() {
                warningBanner.style.display = "none";
            }, 5000);
        }

        var buildUrl = "/Build";
        var buildVersion = "1.3";
        var cacheBuster = "?v=" + buildVersion;
        var loaderUrl = buildUrl + "/OW Build.loader.js" + cacheBuster;
        var config = {
            dataUrl: buildUrl + "/OW Build.data.unityweb" + cacheBuster,
            frameworkUrl: buildUrl + "/OW Build.framework.js.unityweb" + cacheBuster,
            codeUrl: buildUrl + "/OW Build.wasm.unityweb" + cacheBuster,
            streamingAssetsUrl: "/StreamingAssets",
            companyName: "DefaultCompany",
            productName: "APE WAR",
            productVersion: "0.1",
            showBanner: unityShowBanner,
            matchWebGLToCanvasSize: true,
            devicePixelRatio: window.devicePixelRatio || 1,
            autoSyncPersistentDataPath: true,
        };

        // Format bytes to MB string
        function formatMB(bytes) {
            return (bytes / (1024 * 1024)).toFixed(2);
        }

        // Estimate total download size (typical Unity WebGL build)
        var estimatedTotalBytes = 14 * 1024 * 1024; // 14MB estimate, will be refined
        var totalBytesLoaded = 0;

        // Loading phase messages with size tracking
        var loadingMessages = [
            { threshold: 0.0, text: "Downloading game data" },
            { threshold: 0.15, text: "Downloading assets" },
            { threshold: 0.35, text: "Loading textures" },
            { threshold: 0.55, text: "Decompressing modules" },
            { threshold: 0.75, text: "Initializing engine" },
            { threshold: 0.90, text: "Finalizing" }
        ];

        function getLoadingMessage(progress) {
            for (var i = loadingMessages.length - 1; i >= 0; i--) {
                if (progress >= loadingMessages[i].threshold) {
                    return loadingMessages[i].text;
                }
            }
            return loadingMessages[0].text;
        }

        function updateLoadingDisplay(progress) {
            var percent = Math.round(progress * 100);
            loadingBar.style.width = percent + "%";
            loadingPercent.innerText = percent + "%";

            var loadedMB = formatMB(progress * estimatedTotalBytes);
            var totalMB = formatMB(estimatedTotalBytes);
            var msg = getLoadingMessage(progress);

            if (progress < 0.55) {
                // Download phase - show MB
                loadingText.innerText = msg + "  [" + loadedMB + " / " + totalMB + " MB]";
            } else if (progress < 0.90) {
                // Decompression phase - show item count
                var itemsDone = Math.round(progress * 2400);
                var itemsTotal = 2400;
                loadingText.innerText = msg + "  [" + itemsDone + " / " + itemsTotal + " items]";
            } else {
                loadingText.innerText = msg + "...";
            }

            // Update remaining time
            if (progress > lastProgress && progress < 1) {
                var elapsed = (Date.now() - downloadStartTime) / 1000;
                var rate = progress / elapsed;
                var remaining = (1 - progress) / rate;
                if (remaining > 0 && remaining < 300) {
                    loadingSize.textContent = "~" + Math.ceil(remaining) + "s remaining";
                }
            }
            lastProgress = progress;
        }

        var downloadStartTime = Date.now();
        var lastProgress = 0;

        loadingText.textContent = "";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
            createUnityInstance(canvas, config, function(progress) {
                updateLoadingDisplay(progress);

            }).then(function(instance) {
                unityInstance = instance;
                window.unityInstance = instance;

                // Fast path: if WebGL context is already available (cached load), skip immediately
                var immediateCtx = canvas.getContext('webgl2') || canvas.getContext('webgl');
                if (immediateCtx) {
                    skipLoadingScreen();
                    return;
                }

                // Slow path: game still initializing, show spinner and poll
                loadingBar.style.width = "100%";
                loadingPercent.innerText = "100%";
                loadingText.innerText = "Initializing game...";
                loadingSize.textContent = "";

                initSpinner.classList.add('visible');
                loadingBar.classList.add('indeterminate');

                var initCheckCount = 0;
                var maxInitChecks = 100;
                var cachedCtx = null;

                function checkGameReady() {
                    initCheckCount++;

                    if (!cachedCtx) cachedCtx = canvas.getContext('webgl2') || canvas.getContext('webgl');
                    var gameStarted = cachedCtx && initCheckCount > 5;

                    if (gameStarted || initCheckCount >= maxInitChecks) {
                        skipLoadingScreen();
                    } else {
                        setTimeout(checkGameReady, 100);
                    }
                }

                setTimeout(checkGameReady, 500);

            }).catch(function(message) {
                loadingText.innerText = "Error loading game";
                initSpinner.classList.remove('visible');
                console.error(message);
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
