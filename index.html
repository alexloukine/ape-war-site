<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Language" content="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>chimpwar.io</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" type="image/png" href="favicon.png">

    <!-- Xsolla Pay Station Widget -->
    <script src="https://cdn.xsolla.net/payments-bucket-prod/embed/1.5.3/widget.min.js"></script>

    <!-- AppLixir Rewarded Video Ads SDK -->
    <script src="https://cdn.applixir.com/applixir.sdk.js"></script>

    <!-- Chakra Petch font (military style) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Chakra Petch', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: absolute;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ===== LOADING SCREEN ===== */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.6s ease-out, visibility 0.6s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #loading-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Ken Burns background */
        .kb-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url('loader-bg.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1.1);
            z-index: 0;
            animation: kenburns 20s ease-out forwards;
        }

        @keyframes kenburns {
            0% { opacity: 0; transform: scale(1.1); }
            5% { opacity: 1; transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1.0); }
        }

        /* ===== TITLE ===== */
        .title-text {
            font-size: clamp(48px, 10vw, 120px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #fff;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.2s forwards;
            margin-bottom: 48px;
            user-select: none;
            z-index: 1;
        }

        .title-text .title-io {
            font-size: 0.4em;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            vertical-align: baseline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== LOADING BAR ===== */
        .loader-area {
            width: 400px;
            max-width: 80%;
            opacity: 0;
            animation: fadeIn 0.6s ease-out 0.5s forwards;
            z-index: 1;
        }

        .loading-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-bar-fill {
            width: 0%;
            height: 100%;
            background: #22c55e;
            border-radius: 2px;
            transition: width 0.3s ease-out;
        }

        .loading-bar-fill.indeterminate {
            width: 30% !important;
            animation: indeterminate-slide 1.5s infinite ease-in-out;
        }

        @keyframes indeterminate-slide {
            0% { margin-left: 0%; }
            50% { margin-left: 70%; }
            100% { margin-left: 0%; }
        }

        .loading-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .loading-percent {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
            font-variant-numeric: tabular-nums;
        }

        .loading-size {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            font-variant-numeric: tabular-nums;
        }

        .loading-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 16px;
            text-align: center;
            min-height: 18px;
            font-variant-numeric: tabular-nums;
        }

        .init-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 12px auto 0;
        }

        .init-spinner.visible {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translateX(-50%);
            background: rgba(180, 40, 40, 0.95);
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            display: none;
            z-index: 200;
        }

        @media (max-width: 480px) {
            .loading-percent { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="kb-bg"></div>
        <div class="title-text">CHIMPWAR<span class="title-io">.io</span></div>

        <div class="loader-area" id="loader-area">
            <div class="loading-bar-bg">
                <div class="loading-bar-fill" id="loading-bar"></div>
            </div>

            <div class="loading-stats">
                <div class="loading-percent" id="loading-percent">0%</div>
                <div class="loading-size" id="loading-size"></div>
            </div>

            <div class="init-spinner" id="init-spinner"></div>
            <div class="loading-text" id="loading-text"></div>
        </div>
    </div>

    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="0"></canvas>
    </div>

    <div id="unity-warning"></div>

    <script>
        // Global Unity instance reference
        var unityInstance = null;
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingScreen = document.querySelector("#loading-screen");
        var loadingBar = document.querySelector("#loading-bar");
        var loadingPercent = document.querySelector("#loading-percent");
        var loadingText = document.querySelector("#loading-text");
        var loadingSize = document.querySelector("#loading-size");
        var initSpinner = document.querySelector("#init-spinner");
        var warningBanner = document.querySelector("#unity-warning");

        // Skip loading screen immediately (used when game is fully loaded before intro finishes)
        function skipLoadingScreen() {
            loadingScreen.style.pointerEvents = 'none';
            loadingScreen.classList.add('fade-out');
            setTimeout(function() {
                canvas.focus();
                resizeCanvas();
            }, 100);
        }

        // Fix canvas sizing for fullscreen
        function resizeCanvas() {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // Xsolla Pay Station Bridge
        window.xsollaPayStation = { lastStatus: '', lastError: '' };
        window.xsollaOpenPayStation = function(accessToken, isSandbox) {
            window.xsollaPayStation.lastStatus = '';
            window.xsollaPayStation.lastError = '';
            if (document.exitPointerLock) document.exitPointerLock();
            try {
                XPayStationWidget.init({
                    access_token: accessToken,
                    sandbox: !!isSandbox,
                    lightbox: { zIndex: 10000, overlayOpacity: 0.85 }
                });
                XPayStationWidget.on(XPayStationWidget.eventTypes.STATUS_DONE, function() {
                    window.xsollaPayStation.lastStatus = 'done';
                });
                XPayStationWidget.on(XPayStationWidget.eventTypes.CLOSE, function() {
                    if (!window.xsollaPayStation.lastStatus) window.xsollaPayStation.lastStatus = 'close';
                });
                XPayStationWidget.open();
            } catch (e) {
                console.error('[XsollaPayStation] Failed to open:', e);
                window.xsollaPayStation.lastStatus = 'error';
                window.xsollaPayStation.lastError = e.message || 'Unknown error';
            }
        };

        // WASD Input Bridge for Chrome WebGL fix
        // Chrome has issues with Unity's WebGL input handling for certain keys
        // This tracks key states directly in JavaScript and exposes them to Unity
        window.wasdKeyStates = { w: false, a: false, s: false, d: false };
        window.keyStates = {};

        // Unity Input Field Focus Bridge
        // When true, Unity has an input field focused - allow all keys through
        window.unityInputFieldFocused = false;

        // NOTE: The Chrome macOS WASD fix is handled by the keyStates tracking below
        // + WASDInputBridge.jslib + bl_WebGLInputBridge.cs. Game input during typing is
        // blocked by bl_WebGLInputBridge returning false/0 + the isTyping check in keydown.
        // No addEventListener wrapper needed — it was blocking Emscripten's text input pipeline.

        // Prototype-level overrides: prevent Emscripten from blocking keyboard input to Unity's hidden <input>
        (function() {
            var origPreventDefault = Event.prototype.preventDefault;
            var origStopPropagation = Event.prototype.stopPropagation;
            var origStopImmediate = Event.prototype.stopImmediatePropagation;

            Event.prototype.preventDefault = function() {
                if (window.unityInputFieldFocused && this instanceof KeyboardEvent) return;
                return origPreventDefault.call(this);
            };
            Event.prototype.stopPropagation = function() {
                if (window.unityInputFieldFocused && this instanceof KeyboardEvent) return;
                return origStopPropagation.call(this);
            };
            Event.prototype.stopImmediatePropagation = function() {
                if (window.unityInputFieldFocused && this instanceof KeyboardEvent) return;
                return origStopImmediate.call(this);
            };
        })();

        window.setUnityInputFieldFocus = function(focused) {
            window.unityInputFieldFocused = focused;
            // Clear all key states when focusing to prevent stuck movement
            if (focused) {
                window.wasdKeyStates.w = false;
                window.wasdKeyStates.a = false;
                window.wasdKeyStates.s = false;
                window.wasdKeyStates.d = false;
                for (var k in window.keyStates) window.keyStates[k] = false;
            }
        };

        document.addEventListener('keydown', function(e) {
            var key = e.key.toLowerCase();

            // Check if user is typing in a text input - if so, don't block keys
            var activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            var isTyping = (activeTag === 'input' || activeTag === 'textarea') ||
                           (document.activeElement && document.activeElement.isContentEditable) ||
                           window.unityInputFieldFocused ||
                           // Fallback: detect Unity's hidden text input element in the DOM
                           document.querySelector('#unity-container input, #unity-container textarea') !== null;

            // Track all keys via code (only when not typing)
            if (!isTyping) {
                if (e.code) window.keyStates[e.code] = true;
                if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                    window.wasdKeyStates[key] = true;
                }
            }

            // Prevent browser defaults that interfere with gameplay (scroll, focus change)
            // Letter keys have no browser default on a canvas so they don't need preventDefault
            if (!isTyping && (e.code === 'Space' || e.code === 'Tab' || e.code === 'Escape')) {
                e.preventDefault();
            }
        }, true);

        document.addEventListener('keyup', function(e) {
            var key = e.key.toLowerCase();
            if (e.code) window.keyStates[e.code] = false;
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                window.wasdKeyStates[key] = false;
            }
        }, true);

        // Reset key states when window loses focus (prevents stuck keys)
        window.addEventListener('blur', function() {
            window.wasdKeyStates.w = false;
            window.wasdKeyStates.a = false;
            window.wasdKeyStates.s = false;
            window.wasdKeyStates.d = false;
            for (var k in window.keyStates) window.keyStates[k] = false;
            // Mark blur so pointerlockchange knows this isn't ESC
            window.escPassthroughState.recentBlur = true;
            setTimeout(function() { window.escPassthroughState.recentBlur = false; }, 300);
        });

        // Expose WASD states to Unity via jslib (legacy fallback)
        window.getWASDState = function() {
            return JSON.stringify(window.wasdKeyStates);
        };

        // Mouse Movement Bridge for Pointer Lock API
        // Tracks raw mouse movement deltas that work even at screen edges
        window.mouseMovementState = { deltaX: 0, deltaY: 0 };

        // ESC Passthrough Bridge for Pointer Lock
        window.escPassthroughState = { pendingEsc: false, programmaticUnlock: false, recentBlur: false };

        var _origExitPointerLock = document.exitPointerLock.bind(document);
        document.exitPointerLock = function() {
            window.escPassthroughState.programmaticUnlock = true;
            return _origExitPointerLock();
        };

        document.addEventListener('mousemove', function(e) {
            window.mouseMovementState.deltaX += e.movementX || 0;
            window.mouseMovementState.deltaY += e.movementY || 0;
        });

        window.addEventListener('blur', function() {
            window.mouseMovementState.deltaX = 0;
            window.mouseMovementState.deltaY = 0;
            window.escPassthroughState.recentBlur = true;
            setTimeout(function() { window.escPassthroughState.recentBlur = false; }, 300);
        });

        document.addEventListener('pointerlockchange', function() {
            window.mouseMovementState.deltaX = 0;
            window.mouseMovementState.deltaY = 0;

            if (document.pointerLockElement) {
                window.escPassthroughState.programmaticUnlock = false;
            } else {
                if (window.escPassthroughState.programmaticUnlock) {
                    window.escPassthroughState.programmaticUnlock = false;
                } else if (!window.escPassthroughState.recentBlur) {
                    window.escPassthroughState.pendingEsc = true;
                }
            }
        });

        function focusCanvas() {
            if (window.unityInputFieldFocused) return;
            var active = document.activeElement;
            if (active && active !== canvas &&
                (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable)) {
                return;
            }
            canvas.focus();
        }

        // Resume AudioContext on first user gesture (browsers require user interaction)
        function resumeAudioContext() {
            if (window.unityInstance && window.unityInstance.Module) {
                var ctx = window.unityInstance.Module.audioContext ||
                          (typeof AudioContext !== 'undefined' && AudioContext.prototype._unityContext);
                if (ctx && ctx.state === 'suspended') ctx.resume();
            }
            // Also handle any AudioContext created before Unity
            if (typeof AudioContext !== 'undefined') {
                var allContexts = window._audioContexts || [];
                for (var i = 0; i < allContexts.length; i++) {
                    if (allContexts[i].state === 'suspended') allContexts[i].resume();
                }
            }
        }

        document.body.addEventListener("click", function() { focusCanvas(); resumeAudioContext(); });
        document.body.addEventListener("mousedown", focusCanvas);
        document.body.addEventListener("pointerdown", resumeAudioContext);
        document.body.addEventListener("touchstart", resumeAudioContext, { once: true });
        window.addEventListener("focus", focusCanvas);

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                window.escPassthroughState.recentBlur = true;
                setTimeout(function() { window.escPassthroughState.recentBlur = false; }, 300);
            } else {
                setTimeout(focusCanvas, 100);
            }
        });

        function unityShowBanner(msg, type) {
            warningBanner.style.display = "block";
            warningBanner.innerText = msg;
            setTimeout(function() {
                warningBanner.style.display = "none";
            }, 5000);
        }

        var buildUrl = "Build";
        var buildVersion = "0.1";
        var cacheBuster = "?v=" + buildVersion;
        var loaderUrl = buildUrl + "/OW Build.loader.js" + cacheBuster;
        var config = {
            dataUrl: buildUrl + "/OW Build.data.unityweb" + cacheBuster,
            frameworkUrl: buildUrl + "/OW Build.framework.js.unityweb" + cacheBuster,
            codeUrl: buildUrl + "/OW Build.wasm.unityweb" + cacheBuster,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "APE WAR",
            productVersion: "0.1",
            showBanner: unityShowBanner,
            matchWebGLToCanvasSize: true,
            devicePixelRatio: window.devicePixelRatio || 1,
            autoSyncPersistentDataPath: true,
        };

        // Format bytes to MB string
        function formatMB(bytes) {
            return (bytes / (1024 * 1024)).toFixed(2);
        }

        // Estimate total download size (typical Unity WebGL build)
        var estimatedTotalBytes = 14 * 1024 * 1024; // 14MB estimate, will be refined
        var totalBytesLoaded = 0;

        // Loading phase messages with size tracking
        var loadingMessages = [
            { threshold: 0.0, text: "Downloading game data" },
            { threshold: 0.15, text: "Downloading assets" },
            { threshold: 0.35, text: "Loading textures" },
            { threshold: 0.55, text: "Decompressing modules" },
            { threshold: 0.75, text: "Initializing engine" },
            { threshold: 0.90, text: "Finalizing" }
        ];

        function getLoadingMessage(progress) {
            for (var i = loadingMessages.length - 1; i >= 0; i--) {
                if (progress >= loadingMessages[i].threshold) {
                    return loadingMessages[i].text;
                }
            }
            return loadingMessages[0].text;
        }

        function updateLoadingDisplay(progress) {
            var percent = Math.round(progress * 100);
            loadingBar.style.width = percent + "%";
            loadingPercent.innerText = percent + "%";

            var loadedMB = formatMB(progress * estimatedTotalBytes);
            var totalMB = formatMB(estimatedTotalBytes);
            var msg = getLoadingMessage(progress);

            if (progress < 0.55) {
                // Download phase - show MB
                loadingText.innerText = msg + "  [" + loadedMB + " / " + totalMB + " MB]";
            } else if (progress < 0.90) {
                // Decompression phase - show item count
                var itemsDone = Math.round(progress * 2400);
                var itemsTotal = 2400;
                loadingText.innerText = msg + "  [" + itemsDone + " / " + itemsTotal + " items]";
            } else {
                loadingText.innerText = msg + "...";
            }

            // Update remaining time
            if (progress > lastProgress && progress < 1) {
                var elapsed = (Date.now() - downloadStartTime) / 1000;
                var rate = progress / elapsed;
                var remaining = (1 - progress) / rate;
                if (remaining > 0 && remaining < 300) {
                    loadingSize.textContent = "~" + Math.ceil(remaining) + "s remaining";
                }
            }
            lastProgress = progress;
        }

        var downloadStartTime = Date.now();
        var lastProgress = 0;

        loadingText.textContent = "";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
            createUnityInstance(canvas, config, function(progress) {
                updateLoadingDisplay(progress);

            }).then(function(instance) {
                unityInstance = instance;
                window.unityInstance = instance;

                // Fast path: if WebGL context is already available (cached load), skip immediately
                var immediateCtx = canvas.getContext('webgl2') || canvas.getContext('webgl');
                if (immediateCtx) {
                    skipLoadingScreen();
                    return;
                }

                // Slow path: game still initializing, show spinner and poll
                loadingBar.style.width = "100%";
                loadingPercent.innerText = "100%";
                loadingText.innerText = "Initializing game...";
                loadingSize.textContent = "";

                initSpinner.classList.add('visible');
                loadingBar.classList.add('indeterminate');

                var initCheckCount = 0;
                var maxInitChecks = 100;
                var cachedCtx = null;

                function checkGameReady() {
                    initCheckCount++;

                    if (!cachedCtx) cachedCtx = canvas.getContext('webgl2') || canvas.getContext('webgl');
                    var gameStarted = cachedCtx && initCheckCount > 5;

                    if (gameStarted || initCheckCount >= maxInitChecks) {
                        skipLoadingScreen();
                    } else {
                        setTimeout(checkGameReady, 100);
                    }
                }

                setTimeout(checkGameReady, 500);

            }).catch(function(message) {
                loadingText.innerText = "Error loading game";
                initSpinner.classList.remove('visible');
                console.error(message);
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
